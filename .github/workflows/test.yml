name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Unit tests (punch-in reminders, van swaps, punch addresses)
        working-directory: functions
        run: node --test
      - name: Overtime rules (after 8 h a day, no weekly overtime)
        run: node --test tests/overtime.test.mjs
      - name: Punch addresses and van history
        run: node --test tests/addresses.test.mjs

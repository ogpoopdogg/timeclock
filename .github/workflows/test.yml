name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Unit tests (punch-in reminders, van swaps, punch addresses, new @ec.com sign-ins)
        working-directory: functions
        run: node --test
      - name: Overtime rules (after 8 h a day, no weekly overtime)
        run: node --test tests/overtime.test.mjs
      - name: Punch addresses and van history
        run: node --test tests/addresses.test.mjs
      - name: Shared helpers for the new features (vehicle hours, late punches, shop distance, oil check)
        run: node --test tests/features.test.mjs
      - name: Firebase version Garage loads (FIREBASE_SDK)
        run: node --test tests/sdk.test.mjs
      - name: Install steps for each phone and browser
        run: node --test tests/install.test.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Database rules (Realtime Database emulator)
        working-directory: tests/rules
        run: npm ci && npm test

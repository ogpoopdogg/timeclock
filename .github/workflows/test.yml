name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Unit tests (who gets a punch-in reminder, and when)
        working-directory: functions
        run: node --test
      - name: Overtime rules (8 h a day, 40 h a week)
        run: node --test tests/overtime.test.mjs
